<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 86 90" role="img" aria-label="Bastião de Rá"><defs><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#f3d4a0"/><stop offset=".45" stop-color="#c39c44"/><stop offset="1" stop-color="#233f59"/></linearGradient><linearGradient id="fire" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#a83823"/><stop offset=".55" stop-color="#e87529"/><stop offset="1" stop-color="#ff9e32"/></linearGradient><radialGradient id="halo"><stop stop-color="#ff9e32" stop-opacity=".75"/><stop offset="1" stop-color="#ff9e32" stop-opacity="0"/></radialGradient></defs><style>.fire{transform-origin:43px 62px;animation:flicker 1.35s ease-in-out infinite alternate}.ember{animation:rise 2.1s linear infinite}.e2{animation-delay:-.8s}.e3{animation-delay:-1.5s}.glow{animation:glow 1.6s ease-in-out infinite alternate}@keyframes flicker{0%{transform:scale(.96,1.02) skewX(-2deg)}40%{transform:scale(1.03,.93) skewX(3deg)}75%{transform:scale(.97,1.06) skewX(-3deg)}100%{transform:scale(1.02,.98) skewX(1deg)}}@keyframes rise{0%{transform:translate(0,6px);opacity:0}18%{opacity:.95}80%{opacity:.5}100%{transform:translate(5px,-18px);opacity:0}}@keyframes glow{from{opacity:.16}to{opacity:.42}}@media(prefers-reduced-motion:reduce){.fire,.ember,.glow{animation:none}}</style><ellipse class="glow" cx="43" cy="45" rx="42" ry="43" fill="url(#halo)"/><g class="fire"><path d="M43 8C48 24 63 25 58 40C65 36 67 32 68 28C80 47 66 62 43 63C17 63 8 43 23 25C22 37 28 41 31 40C26 26 42 23 43 8Z" fill="url(#fire)" stroke="#8b3f23" stroke-width="1.3"/><path d="M43 24C45 36 55 39 51 47C55 46 58 42 59 40C64 55 54 61 43 62C28 61 24 52 32 42C32 49 36 51 37 47C33 38 43 33 43 24Z" fill="#ff9e32"/><path d="M43 41C42 49 50 52 49 57C49 62 36 62 37 56C37 51 42 49 43 41Z" fill="#fff3a9"/><path d="M25 37Q17 50 29 55M48 18Q53 27 51 32" fill="none" stroke="#ffce75" stroke-width="1.5" stroke-linecap="round"/></g><g fill="#ff9e32"><circle class="ember" cx="26" cy="24" r="1.6"/><circle class